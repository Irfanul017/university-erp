spring.application.name=erp

# PostgreSQL / Supabase configuration
# Set these values in your environment or local .env file before running the app.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.xudnrdzowfwhanebwkjy.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-destructive schema handling against shared Supabase schema
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
server.port=8081

# Library fine policy configuration (rate per overdue day)
library.fine.rate-per-day=${LIBRARY_FINE_RATE_PER_DAY:5.00}
