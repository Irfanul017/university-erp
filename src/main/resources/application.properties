spring.application.name=erp

# PostgreSQL datasource (local development)
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the supplied ERP tables validated/updated and create the library master tables
# that were scaffolded in the repository but absent from the supplied schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
